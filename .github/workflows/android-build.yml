name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909129"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909129" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/26.1.10909129/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Cargo Linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-linux-android]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-android24-clang"' >> ~/.cargo/config.toml

      - name: Build Android APK
        run: |
          cd launcher
          cargo build --target aarch64-linux-android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxl-launcher-release
          path: launcher/target/aarch64-linux-android/release/*.a
