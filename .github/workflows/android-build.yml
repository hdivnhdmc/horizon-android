name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909129"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909129" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android App
        run: |
          cd launcher
          cargo build --target aarch64-linux-android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxl-launcher-release
          path: launcher/target/aarch64-linux-android/release/*.a
