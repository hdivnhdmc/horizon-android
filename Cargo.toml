[workspace]
exclude = ["launcher", "crates/fxl-telemetry-server", "crates/fxl-mod-registry", "third_party/wgpu-hal", "third_party/winit"]
members = [
    "crates/fxl-core",
    "crates/fxl-dualsense",
    "crates/fxl-threads",
    "crates/fxl-hdr",
    "crates/fxl-world",
    "crates/fxl-client",
    "crates/fxl-client-core",
    "crates/fxl-client-input",
    "crates/fxl-client-render",
    "crates/fxl-command",
    "crates/fxl-items",
    "crates/fxl-server-files",
    "crates/fxl-server",
    "crates/fxl-bots",
    "crates/fxl-assets",
    "crates/fxl-protocol",
    "crates/fxl-theme",
    "crates/fxl-prepare",
    "crates/fxl-telemetry",
    "crates/fxl-bench",
    "crates/fxl-friends",
    "crates/fxl-relay",
    "crates/fxl-mod-sdk",
    "crates/fxl-mods",
    "crates/fxl-mods/tests/guest",
    "crates/fxl-mods/tests/ui_guest",
    "crates/cargo-fxl-mod",
    "crates/fxl-port-pack",
    "crates/fxl-shaders",
    "crates/fxl-shader-api",
    "crates/fxl-release-sign",
    "crates/fxl-mod-sdk/examples/coords-hud",
    "crates/fxl-mod-sdk/examples/predator-missile",
    "crates/fxl-mod-sdk/examples/welcome",
    "crates/fxl-mod-sdk/examples/beacons",
    "mods/official/fps-overlay",
    "mods/official/keystrokes",
    "mods/official/far-view",
    "mods/official/minimap",
    "mods/official/zoom",
    "xtask",
    "mods/official/recipes",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# Drop this and the folder once a wgpu release has both fixes.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
# winit 0.30.13 with one change on Android: a gamepad's axes come as device
# motions instead of a touch at their values (third_party/winit, "FXL:")
winit = { path = "third_party/winit" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The Android app's library while iterating (HORIZON_ANDROID_PROFILE=android
# android/build.sh): the fast profile's quick link, no debug info. Releases
# use the release profile.
[profile.android]
inherits = "release"
lto = false
codegen-units = 16
debug = false
